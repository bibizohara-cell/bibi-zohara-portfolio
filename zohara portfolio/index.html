<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopZone - Modern E-Commerce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">Shop<span>Zone</span></div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search products...">
      <button id="search-btn">Search</button>
    </div>
    <div class="cart-icon">
      🛒 Cart (<span id="cart-count">0</span>)
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Upgrade Your Lifestyle</h1>
      <p>Discover top-quality products at unbeatable prices.</p>
      <a href="#products" class="btn">Shop Now</a>
    </div>
  </section>

  <!-- Products Section -->
  <main class="products-section" id="products">
    <h2>Featured Products</h2>
    <div class="products-grid" id="products-grid">
      <!-- Dynamic Products Will Be Rendered Here -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 ShopZone. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
